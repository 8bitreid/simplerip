services:
  simplerip:
    build: .
    restart: unless-stopped

    volumes:
      - ./config:/config:ro
      - /tmp/staging:/staging
      - /mnt/nas/movies:/output    # update to match your NAS mount point

    devices:
      - /dev/sr0:/dev/sr0          # add /dev/sr1 if you have a second drive

    cap_add:
      # Required for raw device I/O (Blu-ray drive access via makemkvcon)
      - SYS_RAWIO
