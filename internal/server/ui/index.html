<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SimpleRip</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="app">
  <nav class="tabbar" aria-label="Dashboard sections">
    <button type="button" data-go="drives">Drives<span id="drives-tab-badge" class="tab-badge tab-badge-dot" hidden></span></button>
    <button type="button" data-go="rips">Recent Rips<span id="rips-tab-badge" class="tab-badge" hidden></span></button>
    <button type="button" data-go="info">Info</button>
  </nav>
  <div class="layout" data-tab="drives">
    <aside class="sidebar">
      <header><h1>SimpleRip</h1></header>
      <div id="info-card" class="info-card panel" data-panel="info">
        <h2>SimpleRip</h2>
        <div class="info-card-body">
          <div class="info-empty">Loading system info…</div>
        </div>
      </div>
    </aside>
    <main class="main-content">
      <div id="drives-grid" class="drives-grid panel" data-panel="drives"></div>
      <div class="panel" data-panel="rips">
        <div class="section-title">Recent Rips <button id="clear-jobs" class="btn" style="margin-left:12px;display:none">Clear all</button></div>
        <div id="jobs-table" class="jobs-table"><div class="jobs-empty">Loading…</div></div>
        <button id="load-more-jobs" class="btn" style="display:none;margin:12px auto">Load more rips</button>
      </div>
    </main>
  </div>
</div>

<dialog id="drive-dialog" class="drive-dialog" aria-labelledby="drive-dialog-title"></dialog>

<script src="/app.js"></script>
</body>
</html>
