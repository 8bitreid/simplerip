<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SimpleRip</title>
<style>
:root {
  --bg:           #0f1117;
  --surface:      #1a1d27;
  --surface2:     #252836;
  --border:       #2d3148;
  --text:         #e2e8f0;
  --text-muted:   #8892a4;
  --accent:       #6366f1;
  --accent-hover: #818cf8;
  --green:        #22c55e;
  --yellow:       #f59e0b;
  --red:          #ef4444;
  --blue:         #3b82f6;
  --radius:       8px;
  --radius-sm:    4px;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg:           #f8fafc;
    --surface:      #ffffff;
    --surface2:     #f1f5f9;
    --border:       #e2e8f0;
    --text:         #1e293b;
    --text-muted:   #64748b;
    --accent:       #6366f1;
    --accent-hover: #4f46e5;
    --green:        #16a34a;
    --yellow:       #d97706;
    --red:          #dc2626;
    --blue:         #2563eb;
  }
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
}

.app {
  max-width: 1100px;
  margin: 0 auto;
  padding: 20px 16px 48px;
}

header {
  display: flex;
  align-items: center;
  margin-bottom: 24px;
}
header h1 {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.02em;
}

/* ── Drive grid ── */

.drives-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 16px;
  margin-bottom: 28px;
}

.drive-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  display: flex;
  flex-direction: column;
}

.drive-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.drive-device {
  font-family: monospace;
  font-size: 12px;
  color: var(--text-muted);
}

.drive-title {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.drive-subtitle {
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 12px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.drive-idle {
  color: var(--text-muted);
  font-size: 13px;
  padding: 8px 0 4px;
}

.drive-idle-warn { color: #e5a13a; }
.drive-idle-ok { color: #4caf7d; }
.drive-media-status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin: 0 0 6px;
  color: var(--text-muted);
  font-size: 12px;
}
.drive-media-status.ok { color: var(--green); }
.drive-media-status.warn { color: var(--yellow); }
.drive-media-status.error { color: var(--red); }

/* ── Stage list ── */

.stages {
  display: flex;
  align-items: flex-start;
  margin: 14px 0 4px;
}
.stage-node {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 1;
  position: relative;
}
.stage-connector {
  flex: 1;
  height: 2px;
  background: var(--border);
  margin-top: 11px;
}
.stage-connector.done { background: rgba(34,197,94,0.35); }
.stage-connector.active { background: rgba(99,102,241,0.35); }

.stage-circle {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text-muted);
  z-index: 1;
}
.stage-circle.done   { background: rgba(34,197,94,0.15); border-color: transparent; color: var(--green); }
.stage-circle.active { background: var(--accent); border-color: transparent; color: #fff; }
.stage-circle.waiting { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.4); color: var(--red); }

.stage-label {
  font-size: 10.5px;
  color: var(--text-muted);
  margin-top: 6px;
  text-transform: none;
  letter-spacing: 0;
}
.stage-label.active { color: var(--text); font-weight: 600; }
.stage-label.done { color: var(--green); }

.stage-progress {
  margin: 4px 0 2px;
}
.stage-progress .prog-wrap { height: 5px; border-radius: 999px; }

.prog-wrap { position: relative; height: 4px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
.prog-fill { height: 100%; border-radius: 2px; transition: width 0.3s ease; background: var(--accent); }
.prog-fill.done { background: var(--green); }

/* Indeterminate sweep for stages with no measurable progress (scan, identify):
   a back-and-forth "radar" pass instead of a misleading static bar. */
.prog-fill.indeterminate {
  position: absolute;
  width: 35%;
  left: 0;
  transition: none;
  animation: prog-sweep 1.1s ease-in-out infinite alternate;
}
@keyframes prog-sweep {
  from { left: 0%; }
  to   { left: 65%; }
}
@media (prefers-reduced-motion: reduce) {
  .prog-fill.indeterminate { animation: none; width: 100%; opacity: 0.4; }
}

.eject-btn {
  display: block;
  width: 100%;
  min-height: 36px;
  flex: 0 0 auto;
  margin-top: auto; /* pin to the bottom of the card */
  padding: 7px 12px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
.eject-spacer { flex: 1 0 14px; }
.drive-actions { display: flex; flex-direction: column; gap: 8px; margin-top: auto; padding-top: 14px; }
.auto-eject-label { display: flex; align-items: center; gap: 7px; color: var(--text-muted); font-size: 12px; cursor: pointer; }
.auto-eject-label input { accent-color: var(--accent); }
.cancel-rip-btn { border-color: var(--red); color: var(--red); }
.cancel-rip-btn:hover { background: rgba(239,68,68,0.12); }
.drive-actions { display: flex; flex-direction: column; gap: 8px; margin-top: auto; padding-top: 14px; }
.auto-eject-label { display: flex; align-items: center; gap: 7px; color: var(--text-muted); font-size: 12px; cursor: pointer; }
.auto-eject-label input { accent-color: var(--accent); }
.cancel-rip-btn { border-color: var(--red); color: var(--red); }
.cancel-rip-btn:hover { background: rgba(239,68,68,0.12); }
.drive-card > .card-edit-btn { align-self: flex-start; margin-top: 10px; }
.eject-btn:hover { background: var(--accent); border-color: var(--accent); color: #fff; }

.card-resolve { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
.card-resolve .search-row { margin-bottom: 8px; }
.card-resolve .search-results { display: flex; flex-direction: column; gap: 4px; }

.card-resolve { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
.card-resolve .search-row { margin-bottom: 8px; }
.card-resolve .search-results { display: flex; flex-direction: column; gap: 4px; }

/* ── Badges ── */

.badge {
  display: inline-flex;
  align-items: center;
  font-size: 11px;
  font-weight: 500;
  padding: 2px 7px;
  border-radius: 10px;
  white-space: nowrap;
}
.badge-idle       { background: var(--surface2); color: var(--text-muted); }
.badge-scan,
.badge-scanning   { background: rgba(59,130,246,0.15); color: var(--blue); }
.badge-score,
.badge-scoring    { background: rgba(99,102,241,0.12); color: var(--accent); }
.badge-identify,
.badge-identifying { background: rgba(245,158,11,0.15); color: var(--yellow); }
.badge-waiting { background: rgba(239,68,68,0.14); color: var(--red); }
.badge-rip,
.badge-analyzing  { background: rgba(59,130,246,0.15); color: var(--blue); }
.badge-ripping    { background: rgba(99,102,241,0.15); color: var(--accent); }
.badge-deliver,
.badge-delivering { background: rgba(245,158,11,0.15); color: var(--yellow); }
.badge-done       { background: rgba(34,197,94,0.15); color: var(--green); }
.badge-error      { background: rgba(239,68,68,0.15); color: var(--red); }
.badge-cancelled  { background: var(--surface2); color: var(--text-muted); }
.badge-pending    { background: var(--surface2); color: var(--text-muted); }
.badge-disc-type  { background: rgba(59,130,246,0.12); color: var(--blue); }

.spinner {
  display: inline-block;
  width: 12px;
  height: 12px;
  border: 2px solid rgba(255,255,255,0.15);
  border-top-color: currentColor;
  border-radius: 50%;
  animation: spinner-rotate 0.7s linear infinite;
  vertical-align: middle;
}
@media (prefers-reduced-motion: reduce) {
  .spinner { animation: none; }
}
@keyframes spinner-rotate {
  to { transform: rotate(360deg); }
}

/* ── Jobs list ── */

.section-title {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  margin-bottom: 10px;
}

.jobs-table {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: visible;
}

.jobs-empty {
  padding: 28px;
  text-align: center;
  color: var(--text-muted);
  font-size: 13px;
}

.has-tip { position: relative; cursor: help; }
.has-tip::after {
  content: attr(data-tip);
  white-space: pre-wrap;
  position: absolute; right: 0; top: calc(100% + 6px);
  width: 340px; max-width: 80vw;
  padding: 10px 12px; border-radius: 6px;
  background: var(--surface2); color: var(--text); border: 1px solid var(--border, #444);
  font-size: 12px; font-weight: 400; line-height: 1.4; text-align: left;
  box-shadow: 0 6px 20px rgba(0,0,0,0.4);
  opacity: 0; pointer-events: none; transition: opacity .12s; z-index: 50;
}
.has-tip:hover::after, .has-tip:focus::after { opacity: 1; }
.job-row {
  display: grid;
  grid-template-columns: 1fr auto auto auto auto auto;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.12s;
  min-width: 0;
}
.job-row:last-child { border-bottom: none; }
.job-row:hover    { background: var(--surface2); }
.job-row.selected { background: var(--surface2); }

.job-title-col { min-width: 0; }
.job-title-text {
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.job-meta { font-size: 11px; color: var(--text-muted); white-space: nowrap; }

/* ── Detail panel ── */

.detail-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-top: 10px;
  padding: 20px;
}

.detail-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 16px;
  gap: 12px;
}
.detail-title { font-size: 17px; font-weight: 700; }
.detail-meta  { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 5px; }
.detail-meta span { font-size: 12px; color: var(--text-muted); }

.close-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 18px;
  line-height: 1;
  padding: 2px 6px;
  border-radius: var(--radius-sm);
  flex-shrink: 0;
}
.close-btn:hover { color: var(--text); background: var(--surface2); }

/* ── Timeline ── */

.timeline { display: flex; flex-direction: column; gap: 1px; margin-bottom: 18px; }

.tl-event {
  display: grid;
  grid-template-columns: 110px 80px 1fr;
  gap: 8px;
  align-items: baseline;
  padding: 5px 8px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 12px;
}
.tl-event:hover { background: var(--surface2); }

.tl-time { color: var(--text-muted); font-family: monospace; font-size: 11px; white-space: nowrap; }
.tl-msg  { color: var(--text); }

.tl-data {
  grid-column: 1 / -1;
  margin: 4px 0 2px 198px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  font-family: monospace;
  font-size: 11px;
  color: var(--text-muted);
  white-space: pre-wrap;
  word-break: break-all;
  display: none;
}
.tl-data.open { display: block; }

/* ── Re-identify ── */

.reid-section {
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}
.reid-heading {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  margin-bottom: 10px;
}
.search-row { display: flex; gap: 8px; margin-bottom: 10px; }
.search-input {
  flex: 1;
  padding: 6px 10px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 13px;
  outline: none;
}
.search-input:focus { border-color: var(--accent); }

.btn {
  padding: 6px 14px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid transparent;
  transition: background 0.15s, opacity 0.15s;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:disabled { opacity: 0.45; cursor: default; }

.search-results { display: flex; flex-direction: column; gap: 4px; }

.sr-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 10px;
  background: var(--surface2);
  border-radius: var(--radius-sm);
}
.sr-title { font-size: 13px; font-weight: 500; }
.sr-meta  { font-size: 11px; color: var(--text-muted); }
.sr-apply {
  padding: 3px 10px;
  font-size: 11px;
  border-radius: var(--radius-sm);
  background: var(--accent);
  color: #fff;
  border: none;
  cursor: pointer;
  flex-shrink: 0;
}
.sr-apply:hover { background: var(--accent-hover); }

.msg-error   { color: var(--red);   font-size: 12px; margin-top: 6px; }
.msg-success { color: var(--green); font-size: 12px; margin-top: 6px; }
.msg-info    { color: var(--text-muted); font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
<div class="app">
  <header><h1>SimpleRip</h1></header>
  <div id="drives-grid" class="drives-grid"></div>
  <div>
    <div class="section-title">Recent Rips <button id="clear-jobs" class="btn" style="margin-left:12px;display:none">Clear all</button></div>
    <div id="jobs-table" class="jobs-table"><div class="jobs-empty">Loading…</div></div>
    <button id="load-more-jobs" class="btn" style="display:none;margin:12px auto">Load more rips</button>
    <div id="detail-panel" style="display:none"></div>
  </div>
</div>

<script>
// Checklist order, matching the real backend pipeline.
const STAGES = ['scan', 'identify', 'score', 'analyze', 'rip', 'deliver'];

// The backend emits progressive ("-ing") stage names; map them to checklist keys.
const STAGE_ALIASES = {
  scanning:    'scan',
  identifying: 'identify',
  scoring:     'score',
  analyzing:   'analyze',
  ripping:     'rip',
  delivering:  'deliver',
};
function fmtETA(sec) {
  if (!sec || sec <= 0) return '';
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  if (h > 0) return `${h}h ${m}m`;
  if (m > 0) return `${m}m ${String(s).padStart(2, '0')}s`;
  return `${s}s`;
}
function canonStage(stage) { return STAGE_ALIASES[stage] || stage; }

// Stages with no measurable progress — show an indeterminate sweep, not a bar.
const INDETERMINATE_STAGES = new Set(['scan', 'identify', 'score']);

// device → ProgressEvent (stage, percent, message, title, device)
const driveStates = {};
const knownDevices = new Set();

// device → { query, results, message } for the inline re-identify search on a card
const cardResolveState = {};

let jobs = [];
let jobsHasMore = false;
let jobsLoadingMore = false;
let selectedJobId = null;
let jobsRefreshTimer = null;

// ── Rendering helpers ────────────────────────────────────────────────────

function esc(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function escAttr(s) {
  return String(s ?? '').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

let savedAutoEject = [];
try { savedAutoEject = JSON.parse(localStorage.getItem('simplerip-auto-eject') || '[]'); } catch (_) {}
const autoEjectDevices = new Set(Array.isArray(savedAutoEject) ? savedAutoEject : []);

function isManualSearchWait(stage, message) {
  const canon = canonStage(stage || '');
  const msg = String(message || '').toLowerCase();
  return canon === 'identify' && (
    msg.includes('waiting for manual movie search') ||
    msg.includes('no main title detected')
  );
}

function badgeHTML(status, message = '') {
  if (isManualSearchWait(status, message)) {
    return '<span class="badge badge-waiting">⚠ awaiting title</span>';
  }
  const s = (status || 'idle').toLowerCase();
  return `<span class="badge badge-${esc(s)}">${esc(s)}</span>`;
}

function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString([], { month: 'short', day: 'numeric' }) +
    ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function fmtJSON(raw) {
  try { return JSON.stringify(typeof raw === 'string' ? JSON.parse(raw) : raw, null, 2); }
  catch (_) { return String(raw ?? ''); }
}

function fmtDiscType(t) {
  switch (t) {
    case 'bluray': return 'Blu-ray';
    case 'dvd':    return 'DVD';
    case 'cd':     return 'CD';
    default:       return t;
  }
}

// Recent Rips only shows finished jobs; in-progress state lives on the drive card.
const TERMINAL_STATUSES = new Set(['done', 'error', 'cancelled']);
function isTerminal(status) {
  return TERMINAL_STATUSES.has(String(status || '').toLowerCase());
}

// Finds the job currently in progress on a device, e.g. to apply a re-identify to it.
function findActiveJobForDevice(device) {
  return jobs.find(j => j.Device === device && !isTerminal(j.Status));
}

function renderResolveResults(device, results) {
  if (!results.length) return '<div class="msg-info">No results found.</div>';
  return results.map(r => `
    <div class="sr-row">
      <div>
        <div class="sr-title">${esc(r.title)}</div>
        <div class="sr-meta">${r.year || '—'}${r.runtime ? ' · ' + r.runtime + ' min' : ''} · ${esc(r.media_type || 'movie')}</div>
      </div>
      <button class="sr-apply card-resolve-apply" data-device="${escAttr(device)}"
        data-id="${r.id}" data-title="${escAttr(r.title)}" data-year="${r.year || 0}">Select</button>
    </div>`).join('');
}

// ── Drive cards ──────────────────────────────────────────────────────────

function ensureDevice(device) {
  if (!device || knownDevices.has(device)) return;
  knownDevices.add(device);
  if (!driveStates[device]) {
    driveStates[device] = { device, stage: 'idle', percent: 0, message: 'no disc — waiting', title: '' };
  }
  renderDrives();
}

function applyProgressEvent(ev) {
  const dev = ev.device;
  if (dev) {
    ensureDevice(dev);
    driveStates[dev] = { ...driveStates[dev], ...ev, device: dev, progressAt: Date.now() };
  }
  renderDrives();
  if (ev.stage === 'done' || ev.stage === 'error' || ev.stage === 'cancelled') {
    scheduleJobsRefresh();
  }
}

function scheduleJobsRefresh() {
  if (jobsRefreshTimer) return;
  jobsRefreshTimer = setTimeout(async () => {
    jobsRefreshTimer = null;
    await loadJobs();
  }, 700);
}

function renderDrives() {
  const grid = document.getElementById('drives-grid');
  // Re-rendering replaces the DOM, which would drop focus and typed text on
  // every progress tick. Skip while the user is typing in a card's search box.
  const focused = document.activeElement;
  if (focused && focused.classList && focused.classList.contains('card-resolve-input')) return;
  const devices = knownDevices.size > 0 ? [...knownDevices] : [];
  if (!devices.length) {
    grid.innerHTML = '<div class="jobs-empty">Loading drives…</div>';
    return;
  }
  grid.innerHTML = devices.map(d => {
    const st = driveStates[d] || { device: d, stage: 'idle', percent: 0, message: 'no disc — waiting', title: '' };
    return driveCardHTML(st);
  }).join('');
  grid.querySelectorAll('.eject-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const d = btn.dataset.device;
      const response = await fetch('/api/eject', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ device: d }),
      }).catch(() => null);
      if (response && !response.ok) {
        const data = await response.json().catch(() => ({}));
        alert(data.error || 'Eject failed.');
      }
    });
  });
  grid.querySelectorAll('.cancel-rip-btn').forEach(btn => btn.addEventListener('click', async () => {
    const d = btn.dataset.device;
    if (!confirm(`Cancel the active rip on ${d}? Any work in progress may be lost.`)) return;
    const response = await fetch('/api/cancel', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ device: d }) }).catch(() => null);
    if (!response || !response.ok) {
      const data = response ? await response.json().catch(() => ({})) : {};
      alert(data.error || 'Could not cancel the rip.');
    }
  }));
  grid.querySelectorAll('.auto-eject-toggle').forEach(input => input.addEventListener('change', async () => {
    const d = input.dataset.device;
    if (input.checked) autoEjectDevices.add(d); else autoEjectDevices.delete(d);
    localStorage.setItem('simplerip-auto-eject', JSON.stringify([...autoEjectDevices]));
    const response = await fetch('/api/auto-eject', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ device: d, enabled: input.checked }) }).catch(() => null);
    if (!response || !response.ok) alert('Could not save the auto-eject setting on the server.');
  }));
  grid.querySelectorAll('.card-edit-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const d = btn.dataset.device;
      const cur = driveStates[d] || {};
      cardResolveState[d] = { query: cur.title || '', results: null, message: '', ...(cardResolveState[d] || {}), open: true };
      renderDrives();
    });
  });
  grid.querySelectorAll('.card-resolve-cancel').forEach(btn => {
    btn.addEventListener('click', () => { delete cardResolveState[btn.dataset.device]; renderDrives(); });
  });
  grid.querySelectorAll('.card-resolve-search').forEach(btn => {
    btn.addEventListener('click', () => doCardSearch(btn.dataset.device));
  });
  grid.querySelectorAll('.card-resolve-input').forEach(input => {
    input.addEventListener('input', () => {
      cardResolveState[input.dataset.device] = { ...(cardResolveState[input.dataset.device] || {}), query: input.value };
    });
    input.addEventListener('keydown', e => { if (e.key === 'Enter') doCardSearch(input.dataset.device); });
  });
  grid.querySelectorAll('.card-resolve-apply').forEach(btn => {
    btn.addEventListener('click', () => applyCardReidentify(btn.dataset.device, {
      tmdb_id: parseInt(btn.dataset.id, 10),
      title:   btn.dataset.title,
      year:    parseInt(btn.dataset.year, 10),
    }));
  });
}

function isDriveActive(st) {
  return !!st.stage && !['idle', 'done', 'error', 'cancelled'].includes(st.stage);
}

function driveIdleState(message) {
  const m = message || '';
  if (/not responding/i.test(m)) return { icon: '⚠️', cls: 'drive-idle-warn', text: m };
  if (/disc detected/i.test(m))  return { icon: '💿', cls: 'drive-idle-ok', text: m };
  if (/loading|detecting/i.test(m)) return { icon: '⏳', cls: '', text: m };
  if (/tray open/i.test(m))      return { icon: '⏏️', cls: '', text: m };
  return { icon: '', cls: '', text: m || 'no disc — waiting' };
}

function driveMediaStatusHTML(status) {
  switch (status) {
    case 'disc_present': return '<div class="drive-media-status ok"><span>●</span> Tray closed · Disc present</div>';
    case 'no_disc': return '<div class="drive-media-status"><span>○</span> Tray closed · Empty</div>';
    case 'tray_open': return '<div class="drive-media-status warn"><span>⏏</span> Tray open · No disc</div>';
    case 'loading': return '<div class="drive-media-status warn"><span>◌</span> Drive loading</div>';
    case 'detecting': return '<div class="drive-media-status"><span>◌</span> Checking drive…</div>';
    case 'unresponsive': return '<div class="drive-media-status error"><span>⚠</span> Drive not responding</div>';
    default: return '<div class="drive-media-status"><span>◌</span> Checking drive…</div>';
  }
}

function driveCardHTML(st) {
  const { stage, percent, message, title } = st;
  const device = st.device;
  const isIdle = !stage || stage === 'idle';
  const discTypeChip = st.disc_type && st.disc_type !== 'unknown'
    ? `<span class="badge badge-disc-type">${esc(fmtDiscType(st.disc_type))}</span>` : '';

  const header = `
    <div class="drive-card-header">
      <div style="display:flex;align-items:center;gap:6px">
        <span class="drive-device">${esc(device)}</span>
        ${discTypeChip}
      </div>
      ${badgeHTML(stage, message)}
    </div>`;

  if (isIdle) {
    return `<div class="drive-card">${header}${driveMediaStatusHTML(st.drive_status)}${(() => { const d = driveIdleState(message); return `<div class="drive-idle ${d.cls}">${d.icon ? `<span class="drive-idle-icon">${d.icon}</span> ` : ""}${esc(d.text)}</div>`; })()}${driveActionsHTML(device, false)}</div>`;
  }

  const titleLine  = title   ? `<div class="drive-title">${esc(title)}</div>` : '';
  const msgLine    = message ? `<div class="drive-subtitle">${esc(message)}</div>` : '';

  // "done" means every stage completed; otherwise locate the active stage.
  const finished = stage === 'done';
  const canon = canonStage(stage);
  const curIdx = finished ? STAGES.length : STAGES.indexOf(canon);
  const stagesHTML = STAGES.map((s, idx) => {
    const isDone   = idx < curIdx;
    const isCurrent = s === canon;
    const waitingIdentify = isCurrent && isManualSearchWait(stage, message) && s === 'identify';
    const indeterminate = isCurrent && INDETERMINATE_STAGES.has(s);

    const circleClass = isDone ? 'done' : waitingIdentify ? 'waiting' : isCurrent ? 'active' : '';
    const labelClass  = isDone ? 'done' : isCurrent ? 'active' : '';
    const icon = isDone
      ? '✓'
      : waitingIdentify
        ? '⚠'
        : indeterminate
          ? '<span class="spinner"></span>'
          : (isCurrent ? '' : '');

    const connectorClass = isDone ? 'done' : (isCurrent ? 'active' : '');

    return `
      <div class="stage-node">
        <div class="stage-circle ${circleClass}">${icon}</div>
        <div class="stage-label ${labelClass}">${esc(s)}</div>
      </div>
      ${idx < STAGES.length - 1 ? `<div class="stage-connector ${connectorClass}"></div>` : ''}`;
  }).join('');

  // only rip/deliver get a progress bar under the stepper — matches the
  // existing pct/indeterminate values, just moved out of the per-row layout
  const activeStageHasBar = curIdx < STAGES.length && !INDETERMINATE_STAGES.has(canon) && canon !== 'idle';
  const pct = activeStageHasBar ? displayPercent(st) : 0;
  const progressHTML = activeStageHasBar
    ? `<div class="stage-progress prog-wrap"><div class="prog-fill" data-progress-device="${escAttr(device)}" style="width:${pct}%"></div></div>`
    : '';
  const etaText = canon === 'rip' ? fmtETA(st.eta_seconds) : '';
  const etaHTML = etaText
    ? `<div class="drive-subtitle">${pct}% · ~${esc(etaText)} remaining</div>`
    : '';

  const canEdit = ['scanning', 'identifying', 'analyzing', 'ripping'].includes(stage);
  const editOpen = canEdit && !!(cardResolveState[device] && cardResolveState[device].open);
  const showResolve = isManualSearchWait(stage, message) || editOpen;
  let resolvePanelHTML = '';
  if (showResolve) {
    const rs = cardResolveState[device] || { query: title || '', results: null, message: '' };
    cardResolveState[device] = rs;
    resolvePanelHTML = `
      <div class="card-resolve" data-device="${escAttr(device)}">
        <div class="search-row">
          <input class="search-input card-resolve-input" data-device="${escAttr(device)}"
            type="text" placeholder="Search TMDB…" value="${escAttr(rs.query)}" />
          <button class="btn btn-primary card-resolve-search" data-device="${escAttr(device)}">Search</button>
          ${editOpen ? `<button class="btn card-resolve-cancel" data-device="${escAttr(device)}">Cancel</button>` : ''}
        </div>
        <div class="search-results">${rs.results ? renderResolveResults(device, rs.results) : ''}</div>
        ${rs.message ? `<div class="${rs.message.startsWith('Error') ? 'msg-error' : 'msg-info'}">${esc(rs.message)}</div>` : ''}
      </div>`;
  }

  return `
    <div class="drive-card">
      ${header}
      ${driveMediaStatusHTML(st.drive_status)}
      ${titleLine}
      ${msgLine}
      <div class="stages">${stagesHTML}</div>
      ${progressHTML}
      ${etaHTML}
      ${canEdit && !showResolve ? `<button class="btn card-edit-btn" data-device="${escAttr(device)}">✎ Edit title</button>` : ''}
      ${resolvePanelHTML}
      ${driveActionsHTML(device, isDriveActive(st))}
    </div>`;
}

// Estimate only a short distance beyond the latest server value. The ETA
// controls the rate; every WebSocket event resets the estimate to the backend
// value, so corrections are smoothly reconciled by the bar's CSS transition.
function displayPercent(st) {
  const base = Number(st.percent) || 0;
  if (canonStage(st.stage) !== 'rip' || !st.progressAt || !st.eta_seconds || base >= 99) return base;
  const elapsedSec = Math.max(0, (Date.now() - st.progressAt) / 1000);
  const remainingPct = Math.max(1, 100 - base);
  const secondsPerPoint = Math.max(1, st.eta_seconds / remainingPct);
  return Math.min(99, base + Math.min(1.5, elapsedSec / secondsPerPoint));
}

// Keep the display moving between backend ticks without re-rendering cards or
// disturbing an open input. This is display-only; backend progress remains the
// source of truth for stage changes and completion.
setInterval(() => {
  document.querySelectorAll('.prog-fill[data-progress-device]').forEach(fill => {
    const st = driveStates[fill.dataset.progressDevice];
    if (st) fill.style.width = `${displayPercent(st)}%`;
  });
}, 250);

function driveActionsHTML(device, active) {
  const checked = autoEjectDevices.has(device) ? 'checked' : '';
  return `<div class="drive-actions">${active ? `<button class="btn cancel-rip-btn" data-device="${escAttr(device)}">Cancel rip</button>` : ''}<label class="auto-eject-label"><input class="auto-eject-toggle" type="checkbox" data-device="${escAttr(device)}" ${checked}> Auto eject when complete</label><button type="button" class="eject-btn" data-device="${escAttr(device)}">⏏ Eject</button></div>`;
}

async function doCardSearch(device) {
  const rs = cardResolveState[device] || { query: '' };
  const q = (rs.query || '').trim();
  if (!q) return;
  cardResolveState[device] = { ...rs, message: '' };
  try {
    const r = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
    const data = await r.json();
    if (!r.ok) {
      cardResolveState[device] = { ...rs, message: data.error || 'Search failed' };
    } else {
      cardResolveState[device] = { ...rs, results: data, message: '' };
    }
  } catch (_) {
    cardResolveState[device] = { ...rs, message: 'Search request failed.' };
  }
  renderDrives();
}

async function applyCardReidentify(device, payload) {
  let job = findActiveJobForDevice(device);
  if (!job) { await loadJobs(); job = findActiveJobForDevice(device); }
  if (!job) {
    cardResolveState[device] = { ...cardResolveState[device], message: 'No active job found for this drive.' };
    renderDrives();
    return;
  }
  try {
    const r = await fetch(`/api/jobs/${encodeURIComponent(job.ID)}/reidentify`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await r.json();
    if (!r.ok) {
      cardResolveState[device] = { ...cardResolveState[device], message: data.error || 'Failed' };
      renderDrives();
      return;
    }
    delete cardResolveState[device]; // card will re-render past "identify" on the next progress event
    if (data.message) showToast(data.message);
    await loadJobs();
  } catch (_) {
    cardResolveState[device] = { ...cardResolveState[device], message: 'Request failed.' };
    renderDrives();
  }
}

function showToast(text) {
  const el = document.createElement('div');
  el.textContent = text;
  el.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);max-width:80vw;padding:10px 16px;background:#222;color:#fff;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.4);z-index:9999;font-size:14px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 8000);
}

// ── Jobs list ────────────────────────────────────────────────────────────

async function loadJobs() {
  await fetchJobsPage(true);
}

async function fetchJobsPage(reset) {
  if (jobsLoadingMore) return;
  jobsLoadingMore = true;
  try {
    const offset = reset ? 0 : jobs.length;
    const r = await fetch(`/api/jobs?limit=100&offset=${offset}`);
    if (!r.ok) return;
    const page = await r.json() || [];
    jobs = reset ? page : jobs.concat(page);
    jobsHasMore = page.length === 100;
    renderJobs();
    jobs.forEach(j => { if (j.Device) ensureDevice(j.Device); });
  } catch (_) {}
  finally {
    jobsLoadingMore = false;
    updateLoadMoreButton();
  }
}

function updateLoadMoreButton() {
  const button = document.getElementById('load-more-jobs');
  button.style.display = jobsHasMore ? 'block' : 'none';
  button.disabled = jobsLoadingMore;
}

async function loadDevices() {
  try {
    const r = await fetch('/api/devices');
    if (!r.ok) return;
    const devices = await r.json() || [];
    devices.forEach(device => {
      ensureDevice(device);
      fetch('/api/auto-eject', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ device, enabled: autoEjectDevices.has(device) }) }).catch(() => {});
    });
  } catch (_) {}
}

function renderJobs() {
  const el = document.getElementById('jobs-table');
  const historical = jobs.filter(j => isTerminal(j.Status));
  document.getElementById('clear-jobs').style.display = historical.length ? '' : 'none';
  updateLoadMoreButton();
  if (!historical.length) {
    el.innerHTML = '<div class="jobs-empty">No completed rips yet.</div>';
    return;
  }
  el.innerHTML = historical.map(j => {
    const title = j.Title || j.DiscLabel || '—';
    const year  = j.Year && !title.includes(`(${j.Year})`) ? ` (${j.Year})` : '';
    const sel   = j.ID === selectedJobId ? ' selected' : '';

    return `
      <div class="job-row${sel}" data-id="${escAttr(j.ID)}">
        <div class="job-title-col">
          <div class="job-title-text">${esc(title)}${esc(year)}</div>
        </div>
        <span class="job-meta">${esc(j.Device || '')}</span>
        <span class="job-meta">${j.DiscType && j.DiscType !== 'unknown' ? esc(fmtDiscType(j.DiscType)) : ''}</span>
        <span class="job-meta">${fmtDate(j.FinishedAt || j.CreatedAt)}</span>
        ${j.Status === 'error' && (j.ErrorSummary || j.ErrorHint)
          ? `<span class="badge badge-error has-tip" tabindex="0" data-tip="${escAttr([j.ErrorSummary, j.ErrorHint && 'Try this: ' + j.ErrorHint].filter(Boolean).join('\n\n'))}">error ⓘ</span>`
          : badgeHTML(j.Status)}
        <button class="btn job-delete" data-id="${escAttr(j.ID)}" title="Delete from history">🗑</button>
      </div>`;
  }).join('');
  el.querySelectorAll('.job-row').forEach(row => {
    row.addEventListener('click', () => openJob(row.dataset.id));
  });
  el.querySelectorAll('.job-delete').forEach(btn => {
    btn.addEventListener('click', e => { e.stopPropagation(); deleteJob(btn.dataset.id); });
  });
}

document.getElementById('load-more-jobs').addEventListener('click', () => fetchJobsPage(false));

async function loadDriveStatuses() {
  try {
    const response = await fetch('/api/status');
    if (!response.ok) return;
    const statuses = await response.json();
    let changed = false;
    for (const [device, status] of Object.entries(statuses || {})) {
      ensureDevice(device);
      const driveStatus = status.drive_status;
      if (driveStatus && driveStates[device].drive_status !== driveStatus) {
        driveStates[device].drive_status = driveStatus;
        changed = true;
      }
    }
    if (changed) renderDrives();
  } catch (_) {}
}

async function deleteJob(id) {
  if (!confirm('Delete this rip from history? Delivered files are not touched.')) return;
  const r = await fetch(`/api/jobs/${encodeURIComponent(id)}`, { method: 'DELETE' });
  if (!r.ok && r.status !== 404) { alert('Delete failed'); return; }
  if (selectedJobId === id) { selectedJobId = null; document.getElementById('detail-panel').style.display = 'none'; }
  await loadJobs();
}

document.getElementById('clear-jobs').addEventListener('click', async () => {
  if (!confirm('Clear all finished rips from history? Delivered files are not touched.')) return;
  const r = await fetch('/api/jobs', { method: 'DELETE' });
  if (!r.ok) { alert('Clear failed'); return; }
  selectedJobId = null;
  document.getElementById('detail-panel').style.display = 'none';
  await loadJobs();
});

// ── Detail panel ─────────────────────────────────────────────────────────

async function openJob(id) {
  const panel = document.getElementById('detail-panel');
  if (selectedJobId === id) {
    selectedJobId = null;
    panel.style.display = 'none';
    renderJobs();
    return;
  }
  selectedJobId = id;
  renderJobs();
  panel.style.display = 'block';
  panel.innerHTML = '<div style="padding:20px;color:var(--text-muted)">Loading…</div>';
  try {
    const r = await fetch(`/api/jobs/${encodeURIComponent(id)}`);
    if (!r.ok) throw new Error('not found');
    const { job, events } = await r.json();
    renderDetail(job, events || []);
  } catch (_) {
    panel.innerHTML = `<div class="detail-panel"><div style="color:var(--red);padding:4px">Failed to load job.</div></div>`;
  }
}

function alternatesHTML(job, events) {
  const ev = [...events].reverse().find(e => e.Stage === 'alternates');
  if (!ev) return '';
  let data = ev.Data;
  try { if (typeof data === 'string') data = JSON.parse(data); } catch (_) { return ''; }
  const cands = (data && data.candidates) || [];
  if (!cands.length) return '';
  const rows = cands.map(c => `
    <div class="tl-event">
      <span class="tl-msg">Title ${esc(String(c.index))} — ${esc(String(c.minutes))} min — ${esc(c.label || '')}</span>
      <button class="btn alt-rip" data-job="${esc(job.ID)}" data-idx="${esc(String(c.index))}">Rip this cut</button>
    </div>`).join('');
  return `<div class="reid-section"><div class="reid-heading">Alternate cuts</div>${rows}<div id="alt-msg"></div></div>`;
}

async function ripAlternate(jobId, idx) {
  try {
    const r = await fetch(`/api/jobs/${encodeURIComponent(jobId)}/alternates/${encodeURIComponent(idx)}/rip`, { method: 'POST' });
    const d = await r.json();
    showToast(r.ok ? 'Ripping the alternate cut. Progress shows on the drive card.' : (d.error || 'Failed'));
  } catch (_) { showToast('Request failed.'); }
}

document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('.alt-rip');
  if (b) ripAlternate(b.dataset.job, b.dataset.idx);
});

function renderDetail(job, events) {
  const panel = document.getElementById('detail-panel');
  const title = job.Title || job.DiscLabel || '—';
  const year  = job.Year ? ` (${job.Year})` : '';

  const timelineHTML = events.length === 0
    ? '<div style="color:var(--text-muted);font-size:12px;padding:4px 0">No events recorded.</div>'
    : events.map((e, i) => {
        const rawData = e.Data;
        const hasData = rawData && rawData !== 'null' && rawData !== '{}' && rawData !== 'undefined';
        return `
          <div class="tl-event" data-i="${i}">
            <span class="tl-time">${esc(fmtTime(e.CreatedAt))}</span>
            ${badgeHTML(e.Stage)}
            <span class="tl-msg">${esc(e.Message)}</span>
            ${hasData ? `<div class="tl-data" id="tdata-${i}">${esc(fmtJSON(rawData))}</div>` : ''}
          </div>`;
      }).join('');

  panel.innerHTML = `
    <div class="detail-panel">
      <div class="detail-header">
        <div>
          <div class="detail-title">${esc(title)}${esc(year)}</div>
          <div class="detail-meta">
            ${badgeHTML(job.Status)}
            <span>${esc(job.Device || '')}</span>
            ${job.DiscType && job.DiscType !== 'unknown' ? `<span class="badge badge-disc-type">${esc(fmtDiscType(job.DiscType))}</span>` : ''}
            <span>${fmtDate(job.CreatedAt)}</span>
          </div>
        </div>
        <button class="close-btn" id="det-close">✕</button>
      </div>
      <div class="timeline">${timelineHTML}</div>
      ${alternatesHTML(job, events)}
      <div class="reid-section">
        <div class="reid-heading">Re-identify</div>
        <div class="search-row">
          <input class="search-input" id="reid-q" type="text"
            placeholder="Search TMDB…"
            value="${escAttr(job.Title || job.DiscLabel || '')}" />
          <button class="btn btn-primary" id="reid-btn">Search</button>
        </div>
        <div id="reid-results" class="search-results"></div>
        <div id="reid-msg"></div>
      </div>
    </div>`;

  document.getElementById('det-close').addEventListener('click', () => {
    selectedJobId = null;
    panel.style.display = 'none';
    renderJobs();
  });

  panel.querySelectorAll('.tl-event').forEach(row => {
    row.addEventListener('click', () => {
      const dd = document.getElementById(`tdata-${row.dataset.i}`);
      if (dd) dd.classList.toggle('open');
    });
  });

  const qInput  = document.getElementById('reid-q');
  const btn     = document.getElementById('reid-btn');
  const results = document.getElementById('reid-results');
  const msg     = document.getElementById('reid-msg');

  async function doSearch() {
    const q = qInput.value.trim();
    if (!q) return;
    btn.disabled = true;
    results.innerHTML = '<div class="msg-info">Searching…</div>';
    msg.innerHTML = '';
    try {
      const r = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
      const data = await r.json();
      if (!r.ok) {
        results.innerHTML = '';
        msg.innerHTML = `<div class="msg-error">${esc(data.error || 'Search failed')}</div>`;
        return;
      }
      if (!data.length) {
        results.innerHTML = '<div class="msg-info">No results found.</div>';
        return;
      }
      results.innerHTML = data.map(r => `
        <div class="sr-row">
          <div>
            <div class="sr-title">${esc(r.title)}</div>
            <div class="sr-meta">${r.year || '—'}${r.runtime ? ' · ' + r.runtime + ' min' : ''} · ${esc(r.media_type || 'movie')}</div>
          </div>
          <button class="sr-apply"
            data-id="${r.id}"
            data-title="${escAttr(r.title)}"
            data-year="${r.year || 0}">Select</button>
        </div>`).join('');
      results.querySelectorAll('.sr-apply').forEach(applyBtn => {
        applyBtn.addEventListener('click', () => applyReidentify(job.ID, {
          tmdb_id: parseInt(applyBtn.dataset.id, 10),
          title:   applyBtn.dataset.title,
          year:    parseInt(applyBtn.dataset.year, 10),
        }));
      });
    } catch (_) {
      results.innerHTML = '';
      msg.innerHTML = '<div class="msg-error">Search request failed.</div>';
    } finally {
      btn.disabled = false;
    }
  }

  btn.addEventListener('click', doSearch);
  qInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
}

async function applyReidentify(jobId, payload) {
  const msg = document.getElementById('reid-msg');
  if (!msg) return;
  msg.innerHTML = '<div class="msg-info">Applying…</div>';
  try {
    const r = await fetch(`/api/jobs/${encodeURIComponent(jobId)}/reidentify`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await r.json();
    if (!r.ok) {
      msg.innerHTML = `<div class="msg-error">${esc(data.error || 'Failed')}</div>`;
      return;
    }
    msg.innerHTML = `<div class="msg-success">Updated to "${esc(data.Title || payload.title)}". ${esc(data.message || '')}</div>`;
    await loadJobs();
    // Re-render the detail panel with fresh data
    const selectedId = selectedJobId;
    selectedJobId = null;
    await openJob(selectedId);
  } catch (_) {
    msg.innerHTML = '<div class="msg-error">Request failed.</div>';
  }
}

// ── WebSocket ────────────────────────────────────────────────────────────

function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const ws = new WebSocket(`${proto}//${location.host}/ws/progress`);
  ws.onmessage = e => {
    try { applyProgressEvent(JSON.parse(e.data)); } catch (_) {}
  };
  ws.onclose = () => setTimeout(connectWS, 3000);
}

// ── Boot ─────────────────────────────────────────────────────────────────

loadDevices();
loadJobs();
loadDriveStatuses();
setInterval(loadDriveStatuses, 5000);
connectWS();
</script>
