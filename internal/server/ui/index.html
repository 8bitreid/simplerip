<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpleRip</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1b26;
            color: #c0caf5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            color: #7aa2f7;
            font-size: 2.5rem;
            font-weight: 300;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #565f89;
            font-size: 1rem;
        }

        .status-card {
            background: #24283b;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            margin-bottom: 2rem;
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .stage {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.25rem 0.75rem;
            border-radius: 6px;
            font-weight: 600;
        }

        .stage.idle { background: #565f89; color: #c0caf5; }
        .stage.scanning { background: #7aa2f7; color: #1a1b26; }
        .stage.ripping { background: #bb9af7; color: #1a1b26; }
        .stage.delivering { background: #9ece6a; color: #1a1b26; }
        .stage.done { background: #9ece6a; color: #1a1b26; }
        .stage.error { background: #f7768e; color: #1a1b26; }

        .title {
            font-size: 1.5rem;
            color: #c0caf5;
            font-weight: 500;
        }

        .message {
            color: #a9b1d6;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
            min-height: 1.5rem;
        }

        .progress-container {
            position: relative;
            background: #1a1b26;
            border-radius: 8px;
            height: 32px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #7aa2f7 0%, #bb9af7 100%);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 1rem;
        }

        .progress-text {
            color: #1a1b26;
            font-weight: 600;
            font-size: 0.875rem;
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        .connection-status {
            text-align: center;
            padding: 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-bottom: 2rem;
        }

        .connection-status.connected {
            background: rgba(158, 206, 106, 0.1);
            color: #9ece6a;
        }

        .connection-status.disconnected {
            background: rgba(247, 118, 142, 0.1);
            color: #f7768e;
        }

        .footer {
            text-align: center;
            color: #565f89;
            font-size: 0.875rem;
            margin-top: auto;
            padding-top: 2rem;
        }

        .footer a {
            color: #7aa2f7;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .stage.scanning,
        .stage.ripping,
        .stage.delivering {
            animation: pulse 2s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>SimpleRip</h1>
            <div class="subtitle">Minimal disc ripper</div>
        </header>

        <div id="connection" class="connection-status disconnected">
            Connecting to server...
        </div>

        <div class="status-card">
            <div class="status-header">
                <span id="stage" class="stage idle">idle</span>
                <div id="title" class="title">No active job</div>
            </div>
            <div id="message" class="message">Waiting for disc...</div>
            <div class="progress-container">
                <div id="progress-bar" class="progress-bar" style="width: 0%">
                </div>
                <div id="progress-text" class="progress-text">0%</div>
            </div>
        </div>

        <div class="footer">
            <a href="https://github.com/8bitreid/simplerip" target="_blank" rel="noopener noreferrer">github.com/8bitreid/simplerip</a>
        </div>
    </div>

    <script>
        let ws = null;
        let reconnectTimer = null;
        const reconnectDelay = 3000;

        const elements = {
            connection: document.getElementById('connection'),
            stage: document.getElementById('stage'),
            title: document.getElementById('title'),
            message: document.getElementById('message'),
            progressBar: document.getElementById('progress-bar'),
            progressText: document.getElementById('progress-text')
        };

        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/progress`;
            
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                console.log('WebSocket connected');
                updateConnectionStatus(true);
                if (reconnectTimer) {
                    clearTimeout(reconnectTimer);
                    reconnectTimer = null;
                }
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    updateProgress(data);
                } catch (err) {
                    console.error('Failed to parse message:', err);
                }
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };

            ws.onclose = () => {
                console.log('WebSocket disconnected');
                updateConnectionStatus(false);
                reconnectTimer = setTimeout(connect, reconnectDelay);
            };
        }

        function updateConnectionStatus(connected) {
            if (connected) {
                elements.connection.className = 'connection-status connected';
                elements.connection.textContent = '● Connected';
            } else {
                elements.connection.className = 'connection-status disconnected';
                elements.connection.textContent = '○ Disconnected - reconnecting...';
            }
        }

        function updateProgress(data) {
            // Update stage badge
            elements.stage.className = `stage ${data.stage}`;
            elements.stage.textContent = data.stage;

            // Update title
            if (data.title) {
                elements.title.textContent = data.title;
            } else {
                elements.title.textContent = 
                    data.stage === 'idle' ? 'No active job' : 
                    data.stage === 'error' ? 'Error occurred' : 
                    'Processing...';
            }

            // Update message
            elements.message.textContent = data.message || '';

            // Update progress bar
            const percent = Math.max(0, Math.min(100, data.percent || 0));
            elements.progressBar.style.width = `${percent}%`;
            elements.progressText.textContent = `${percent}%`;

            // Update page title
            if (data.stage === 'idle') {
                document.title = 'SimpleRip';
            } else {
                document.title = `SimpleRip - ${data.stage} ${percent}%`;
            }
        }

        // Initialize connection on page load
        connect();

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (ws) {
                ws.close();
            }
            if (reconnectTimer) {
                clearTimeout(reconnectTimer);
            }
        });
    </script>
</body>
</html>
