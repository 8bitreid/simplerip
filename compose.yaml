services:
  simplerip:
    build: .
    image: simplerip:local
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./makemkv-config:/root/.MakeMKV
      - ./staging:/staging
      - /mnt/nas-simplerip/Dev Movies:/output
    devices:
      - /dev/sr0:/dev/sr0
      - /dev/sr1:/dev/sr1
      - /dev/sg0:/dev/sg0
      - /dev/sg1:/dev/sg1
    privileged: true
    user: root
    environment:
      - MAKEMKV_KEY=${MAKEMKV_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: simplerip
      POSTGRES_USER: simplerip
      POSTGRES_PASSWORD: simplerip
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simplerip -d simplerip"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
