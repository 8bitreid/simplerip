services:
  simplerip:
    image: ghcr.io/8bitreid/simplerip:latest
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./makemkv-config:/root/.MakeMKV
      - /tmp/staging:/staging
      - /mnt/nas-simplerip/Dev Movies:/output
    devices:
      - /dev/sr0:/dev/sr0
      - /dev/sr1:/dev/sr1
    privileged: true
    user: root
    environment:
      - MAKEMKV_KEY=${MAKEMKV_KEY:-}
