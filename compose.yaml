services:
  simplerip:
    image: ghcr.io/8bitreid/simplerip:latest
    restart: unless-stopped
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - /tmp/staging:/staging
      - /output:/output
    devices:
      - /dev/sr0:/dev/sr0
      - /dev/sr1:/dev/sr1
    cap_add:
      - SYS_RAWIO
