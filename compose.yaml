services:
  simplerip:
    build: .
    image: simplerip:local
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./makemkv-config:/root/.MakeMKV
      - ./staging:/staging
      - /mnt/nas-simplerip/Dev Movies:/output
    devices:
      - /dev/sr0:/dev/sr0
      - /dev/sr1:/dev/sr1
      - /dev/sg0:/dev/sg0
      - /dev/sg1:/dev/sg1
    privileged: true
    user: root
    environment:
      - MAKEMKV_KEY=${MAKEMKV_KEY:-}
      - TMDB_ACCESS_TOKEN=${TMDB_ACCESS_TOKEN:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - SIMPLERIP_UI_URL=${SIMPLERIP_UI_URL:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: simplerip
      POSTGRES_USER: simplerip
      POSTGRES_PASSWORD: simplerip
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simplerip -d simplerip"]
      interval: 5s
      timeout: 5s
      retries: 10

  alloy:
    image: grafana/alloy:latest
    restart: unless-stopped
    command: run /etc/alloy/config.alloy
    environment:
      LOKI_URL: ${LOKI_URL:?set LOKI_URL, e.g. http://host:3100/loki/api/v1/push}
    volumes:
      - ./observability/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  pgdata:
